[package]
name = "looper"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "looper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
# demucs-rs v0.3.5, the same commit the web build's wasm comes from.
demucs-core = { git = "https://github.com/nikhilunni/demucs-rs", rev = "805d6f72ede20282832ac78c634e8767716c0b21", features = ["wgpu", "autotune", "fusion"] }
burn = { version = "0.20.1", features = ["wgpu", "autotune", "fusion", "metal"] }
cubecl = { version = "0.9", default-features = false }
pollster = "0.4"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# Dependencies (Burn, wgpu, demucs) are unusably slow unoptimised; keep `tauri dev` fast at runtime.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
